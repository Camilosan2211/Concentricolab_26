<!DOCTYPE html>
<html lang="es-CO" class="dark">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Concéntrico Lab — Producto, marca y experiencia</title>
    <meta name="description" content="Concéntrico Lab diseña productos, marcas y experiencias digitales que conectan estrategia, creatividad y tecnología desde Bogotá, Colombia."/>
    <meta name="robots" content="index, follow, max-image-preview:large"/>
    <meta name="author" content="Concéntrico Lab"/>
    <meta name="keywords" content="diseño de producto, branding, experiencia digital, diseño UX UI, automatización, Bogotá"/>

    <!-- Open Graph -->
    <meta property="og:title"
      content="Concéntrico Lab — Producto, marca y experiencia"/>
    <meta property="og:description"
      content="Consultora de diseño en la intersección entre producto, marca y experiencia digital. Bogotá, Colombia."/>
    <meta property="og:url" content="https://concentricolab.com/"/>
    <meta property="og:type" content="website"/>
    <meta property="og:locale" content="es_CO"/>
    <meta property="og:image"
      content="https://concentricolab.com/assets/images/og-image.png"/>

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title"
      content="Concéntrico Lab — Producto, marca y experiencia"/>
    <meta name="twitter:description"
      content="Consultora de diseño en la intersección entre producto, marca y experiencia digital. Bogotá, Colombia."/>
    <meta name="twitter:image"
      content="https://concentricolab.com/assets/images/og-image.png"/>

    <!-- Canonical + theme -->
    <link rel="canonical" href="https://concentricolab.com/"/>
    <meta id="theme-color" name="theme-color" content="#00031F"/>
    <link rel="icon" href="/assets/images/favicon.png"/>

    <!-- Fonts — Inter desde Google, Cal Sans self-hosted vía npm -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"/>

    <!-- JSON-LD Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Concéntrico Lab",
      "url": "https://concentricolab.com",
      "logo": "https://concentricolab.com/assets/images/logo.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bogotá",
        "addressCountry": "CO"
      },
      "sameAs": [
        "https://www.instagram.com/concentricolab",
        "https://www.linkedin.com/company/concentricolab/",
        "https://www.youtube.com/@ConcentricoLab"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
